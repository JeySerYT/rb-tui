name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: compile
        run: python -m compileall -q rb_tui
      - name: run tests
        run: python -m unittest discover -s tests -v
      - name: cli smoke
        run: |
          python -m rb_tui --version
          python -m rb_tui --diag

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: smoke
        run: |
          rb-tui --version
          rb-tui --help > /dev/null
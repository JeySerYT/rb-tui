name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: compile
        run: python -m compileall -q rb_tui

      - name: run tests
        run: python -m unittest discover -s tests -v

  build:
    name: build ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: linux-x86_64
            python_setup: system
          - os: ubuntu-24.04-arm
            asset: linux-arm64
            python_setup: actions
          - os: macos-15
            asset: darwin-arm64
            python_setup: actions
          - os: windows-latest
            asset: windows-x86_64
            python_setup: official
    steps:
      - uses: actions/checkout@v4

      # Linux x86_64 собираем системным Python 3.10 из Ubuntu 22.04:
      # python-build-standalone из setup-python собран с AVX и падает
      # на процессорах без AVX (SIGILL).
      # Windows собираем официальным Python с python.org:
      # toolcache-сборка тоже требует AVX.
      - uses: actions/setup-python@v5
        if: matrix.python_setup == 'actions'
        with:
          python-version: "3.12"

      - name: install pyinstaller (system python)
        if: matrix.python_setup == 'system'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/pip" install --upgrade pip pyinstaller

      - name: install pyinstaller (official python)
        if: matrix.python_setup == 'official'
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\python-setup.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\python-setup.exe" -Wait -ArgumentList `
            "/quiet", "InstallAllUsers=0", "TargetDir=C:\py312", `
            "Include_pip=1", "Include_test=0", "Include_launcher=0", "PrependPath=0"
          C:\py312\python.exe -m pip install --upgrade pip pyinstaller

      - name: install pyinstaller
        if: matrix.python_setup == 'actions'
        run: python -m pip install --upgrade pip pyinstaller

      - name: build (system python)
        if: matrix.python_setup == 'system'
        shell: bash
        run: "$RUNNER_TEMP/build-venv/bin/pyinstaller --clean --noconfirm packaging/rb-tui.spec"

      - name: build (official python)
        if: matrix.python_setup == 'official'
        shell: pwsh
        run: C:\py312\python.exe -m PyInstaller --clean --noconfirm packaging/rb-tui.spec

      - name: build
        if: matrix.python_setup == 'actions'
        run: pyinstaller --clean --noconfirm packaging/rb-tui.spec

      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p out
          asset="rb-tui-${{ matrix.asset }}.tar.gz"
          tar -czf "out/$asset" -C dist rb-tui
          if command -v sha256sum >/dev/null 2>&1; then
            sum="sha256sum"
          else
            sum="shasum -a 256"
          fi
          (cd out && $sum "$asset" > "$asset.sha256")

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $asset = "rb-tui-${{ matrix.asset }}.zip"
          Compress-Archive -Path dist/rb-tui.exe -DestinationPath "out/$asset"
          $hash = (Get-FileHash "out/$asset" -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "out/$asset.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh install.ps1 out/
          if python scripts/release_notes.py "${GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.md"; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
              --notes-file "$RUNNER_TEMP/notes.md" out/*
          else
            echo "в CHANGELOG.md нет секции для ${GITHUB_REF_NAME}, беру автозаметки"
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
              --generate-notes out/*
          fi